  /quizzes/{quizId}/stats:
    get:
      operationId: getStats
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatsResponse"
          description: OK
        "401":
          content:
