  /quizzes/{quizId}/submissions:
    post:
      operationId: createSubmission
      parameters:
        - in: path
          name: quizId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionCreateRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
          description: OK
        "401":
