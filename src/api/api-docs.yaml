components:
  schemas:
    AiGenerateQuestionsRequest:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt
    AnswerDto:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceAnswerDto"
          single-choice: "#/components/schemas/SingleChoiceAnswerDto"
          text: "#/components/schemas/TextAnswerDto"
        propertyName: dtype
      properties:
        dtype:
          type: string
        id:
          type:
            - integer
            - "null"
          format: int64
        questionId:
          type: integer
          format: int64
      required:
        - dtype
        - questionId
    AnswerDtoVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceAnswerDto"
        - $ref: "#/components/schemas/SingleChoiceAnswerDto"
        - $ref: "#/components/schemas/TextAnswerDto"
    ChangeCredentialsRequest:
      type: object
      properties:
        currentPassword:
          type:
            - string
            - "null"
        newLogin:
          type:
            - string
            - "null"
          pattern: "^[a-zA-Z0-9._-]{5,30}$"
        newPassword:
          type:
            - string
            - "null"
          maxLength: 2147483647
          minLength: 6
    ChoiceDto:
      type: object
      properties:
        id:
          type:
            - integer
            - "null"
          format: int64
        name:
          type: string
        position:
          type: integer
          format: int32
          minimum: 0
      required:
        - name
        - position
    ChoiceStatsDto:
      type: object
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        id:
          type:
            - integer
            - "null"
          format: int64
      required:
        - count
    ErrorDto:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    LoginRequest:
      type: object
      properties:
        password:
          type: string
    MultiChoiceAnswerDto:
      allOf:
        - $ref: "#/components/schemas/AnswerDto"
        - type: object
          properties:
            selectedChoiceIds:
              type: array
              items:
                type: integer
                format: int64
      required:
        - questionId
        - selectedChoiceIds
    MultiChoiceQuestionDto:
      allOf:
        - $ref: "#/components/schemas/QuestionDto"
        - type: object
          properties:
            possibleChoices:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDto"
      required:
        - isRequired
        - name
        - position
        - possibleChoices
    MultiChoiceQuestionStatsDto:
      allOf:
        - $ref: "#/components/schemas/QuestionStatsDto"
        - type: object
          properties:
            choiceStats:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceStatsDto"
      required:
        - answerCount
        - choiceStats
        - questionId
    PollCreateRequest:
      type: object
      properties:
        description:
          type:
            - string
            - "null"
        name:
          type: string
          maxLength: 255
          minLength: 0
      required:
        - name
    PollQuestionsUpsertRequest:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionDtoVariant"
      required:
        - questions
    PollResponse:
      type: object
      properties:
        createdDate:
          type: string
          format: date-time
        description:
          type:
            - string
            - "null"
        id:
          type: integer
          format: int64
        mySubmissionsCount:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
          minLength: 0
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionDtoVariant"
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - FINISHED
      required:
        - createdDate
        - id
        - mySubmissionsCount
        - name
        - questions
        - status
    PollsResponse:
      type: object
      properties:
        polls:
          type: array
          items:
            $ref: "#/components/schemas/ShortPollResponse"
      required:
        - polls
    QuestionDto:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceQuestionDto"
          single-choice: "#/components/schemas/SingleChoiceQuestionDto"
          text: "#/components/schemas/TextQuestionDto"
        propertyName: dtype
      properties:
        description:
          type:
            - string
            - "null"
        dtype:
          type: string
        id:
          type:
            - integer
            - "null"
          format: int64
        isRequired:
          type: boolean
        name:
          type: string
          maxLength: 255
          minLength: 0
        position:
          type: integer
          format: int32
          minimum: 0
      required:
        - dtype
        - isRequired
        - name
        - position
    QuestionDtoVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceQuestionDto"
        - $ref: "#/components/schemas/SingleChoiceQuestionDto"
        - $ref: "#/components/schemas/TextQuestionDto"
    QuestionStatsDto:
      type: object
      discriminator:
        mapping:
          multi-choice: "#/components/schemas/MultiChoiceQuestionStatsDto"
          single-choice: "#/components/schemas/SingleChoiceQuestionStatsDto"
          text: "#/components/schemas/TextQuestionStatsDto"
        propertyName: dtype
      properties:
        answerCount:
          type: integer
          format: int64
        dtype:
          type: string
        questionId:
          type: integer
          format: int64
      required:
        - answerCount
        - dtype
        - questionId
    QuestionStatsDtoVariant:
      oneOf:
        - $ref: "#/components/schemas/MultiChoiceQuestionStatsDto"
        - $ref: "#/components/schemas/SingleChoiceQuestionStatsDto"
        - $ref: "#/components/schemas/TextQuestionStatsDto"
    SessionResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ShortPollResponse:
      type: object
      properties:
        createdDate:
          type: string
          format: date-time
        description:
          type:
            - string
            - "null"
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - FINISHED
      required:
        - createdDate
        - id
        - name
        - status
    SingleChoiceAnswerDto:
      allOf:
        - $ref: "#/components/schemas/AnswerDto"
        - type: object
          properties:
            selectedChoiceId:
              type: integer
              format: int64
      required:
        - questionId
        - selectedChoiceId
    SingleChoiceQuestionDto:
      allOf:
        - $ref: "#/components/schemas/QuestionDto"
        - type: object
          properties:
            possibleChoices:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceDto"
      required:
        - isRequired
        - name
        - position
        - possibleChoices
    SingleChoiceQuestionStatsDto:
      allOf:
        - $ref: "#/components/schemas/QuestionStatsDto"
        - type: object
          properties:
            choiceStats:
              type: array
              items:
                $ref: "#/components/schemas/ChoiceStatsDto"
      required:
        - answerCount
        - choiceStats
        - questionId
    StatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/QuestionStatsDtoVariant"
        submissionsCount:
          type: integer
          format: int64
      required:
        - stats
        - submissionsCount
    SubmissionCreateRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerDtoVariant"
      required:
        - answers
    SubmissionResponse:
      type: object
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerDtoVariant"
        createdDate:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        pollId:
          type: integer
          format: int64
      required:
        - answers
        - createdDate
        - id
        - pollId
    TextAnswerDto:
      allOf:
        - $ref: "#/components/schemas/AnswerDto"
        - type: object
          properties:
            value:
              type: string
      required:
        - questionId
        - value
    TextQuestionDto:
      allOf:
        - $ref: "#/components/schemas/QuestionDto"
        - type: object
          properties:
            maxLength:
              type:
                - integer
                - "null"
              format: int32
      required:
        - isRequired
        - name
        - position
    TextQuestionStatsDto:
      allOf:
        - $ref: "#/components/schemas/QuestionStatsDto"
      required:
        - answerCount
        - questionId
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isRegistered:
          type: boolean
        login:
          type:
            - string
            - "null"
        roles:
          type: array
          items:
            type: string
            enum:
              - ANONYMOUS
              - REGISTERED
              - ADMIN
      required:
        - id
        - isRegistered
        - roles
  securitySchemes:
    bearer-key:
      scheme: bearer
      type: http
