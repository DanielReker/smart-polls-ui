  /users/me/sessions:
    delete:
      operationId: logoutEverywhere
      responses:
        "200":
          description: OK
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Unauthorized
        "404":
