              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Unauthorized
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Not Found
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Conflict
      security:
        - bearer-key: []
      tags:
