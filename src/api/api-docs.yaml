  /users:
    post:
      operationId: createUser
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: OK
        "401":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Unauthorized
        "404":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Not Found
        "409":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorDto"
          description: Conflict
      tags:
